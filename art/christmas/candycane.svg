<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" xmlns:c2pa="http://c2pa.org/manifest">
  <!-- Stripes are a dashed stroke along the same path. No clipPath (which
       ignores strokes) and no mask (which cairosvg renders unreliably) -
       a dash pattern puts the bands across the cane exactly where they belong. -->
  <path d="M76 184 L76 84 C76 46 144 46 144 92" fill="none"
        stroke="#4a3b32" stroke-width="54" stroke-linecap="round"/>
  <path d="M76 184 L76 84 C76 46 144 46 144 92" fill="none"
        stroke="#fdf6ef" stroke-width="42" stroke-linecap="round"/>
  <path d="M76 184 L76 84 C76 46 144 46 144 92" fill="none"
        stroke="#d9534f" stroke-width="42" stroke-linecap="butt"
        stroke-dasharray="15 21" stroke-dashoffset="8"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
